# ===============================================================# ESTÁNDARES DE JPA / HIBERNATE# ===============================================================spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialectspring.jpa.properties.hibernate.transaction.jta.platform=nonespring.jpa.open-in-view=falsespring.jpa.properties.hibernate.jdbc.time_zone=America/Bogotaspring.jpa.properties.hibernate.jdbc.batch_size=100spring.jpa.properties.hibernate.order_inserts=truespring.jpa.properties.hibernate.order_updates=truespring.jpa.properties.hibernate.jdbc.batch_versioned_data=truespring.jpa.hibernate.ddl-auto=nonespring.hibernate.hbm2ddl.auto=none# ===============================================================# ESTÁNDARES DE LOGGING (Formatos)# ===============================================================spring.output.ansi.enabled=ALWAYSlogging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wExlogging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%t] %-40.40logger{39} : %m%n%wEx# ===============================================================# ESTÁNDARES DE KAFKA (Tuning Técnico)# ===============================================================spring.kafka.consumer.auto-offset-reset=earliestspring.kafka.properties.security.protocol=PLAINTEXTspring.kafka.producer.acks=1spring.kafka.producer.retries=1spring.kafka.consumer.max-poll-records=1spring.kafka.consumer.properties.max.poll.interval.ms=3600000spring.kafka.consumer.properties.session.timeout.ms=60000spring.kafka.consumer.properties.heartbeat.interval.ms=10000# ===============================================================# ACTUATOR & REGIONAL# ===============================================================management.endpoints.web.exposure.include=httptracemanagement.httpexchanges.recording.enabled=truemanagement.endpoint.health.show-details=alwaysmanagement.endpoint.health.show-components=alwaysmanagement.simple.metrics.export.enabled=trueapp.locale=es-ESspring.jackson.time-zone=America/Bogota# ===============================================================# SUBIDA DE ARCHIVOS# ===============================================================spring.servlet.multipart.max-file-size=50MBspring.servlet.multipart.max-request-size=500MB# ===============================================================# HIKARI POOL (Estructura General)# ===============================================================spring.datasource.command.driverClassName=org.postgresql.Driverspring.datasource.query.driverClassName=org.postgresql.Driverspring.datasource.command.hikari.idleTimeout=300000spring.datasource.command.hikari.connectionTimeout=20000spring.datasource.query.hikari.idleTimeout=300000spring.datasource.query.hikari.connectionTimeout=20000spring.datasource.command.hikari.poolName=CommandHikariPoolspring.datasource.query.hikari.poolName=QueryHikariPool# ===============================================================# SPRINGDOC OPENAPI# ===============================================================springdoc.api-docs.path=/v3/api-docsspringdoc.api-docs.enabled=truespringdoc.swagger-ui.path=/swagger-ui.htmlspringdoc.swagger-ui.enabled=truespringdoc.swagger-ui.operations-sorter=methodspringdoc.swagger-ui.tags-sorter=alphaspringdoc.swagger-ui.disable-swagger-default-url=truespringdoc.swagger-ui.display-request-duration=truespringdoc.swagger-ui.doc-expansion=nonespringdoc.swagger-ui.filter=truespringdoc.swagger-ui.show-extensions=truespringdoc.swagger-ui.show-common-extensions=truespringdoc.swagger-ui.default-models-expand-depth=3springdoc.swagger-ui.default-model-expand-depth=3springdoc.swagger-ui.display-operation-id=falsespringdoc.swagger-ui.try-it-out-enabled=truespringdoc.show-actuator=truespringdoc.paths-to-match=/api/**springdoc.packages-to-scan=com.empresa.plantilla.infrastructure.controllerspringdoc.default-consumes-media-type=application/jsonspringdoc.default-produces-media-type=application/jsonspringdoc.writer-with-default-pretty-printer=true