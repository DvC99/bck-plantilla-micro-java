server.port=${SERVER_PORT:8081}
grpc.server.port=${GRPC_SERVER_PORT:9091}

# ===============================================================
# JPA DEVELOPMENT (Sobrescritura)
# ===============================================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.format_sql=true
# Desactiva el uso de Spring Cloud Config en desarrollo local
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
# Dialecto para Postgres en desarrollo
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.messaging.kafka.enabled=false
# ===============================================================
# BASE DE DATOS COMPARTIDA (Servidor y Credenciales de DEV)
# ===============================================================
spring.datasource.command.url=${SPRING_DATASOURCE_COMMAND_URL}
spring.datasource.command.username=${SPRING_DATASOURCE_COMMAND_USERNAME}
spring.datasource.command.password=${SPRING_DATASOURCE_COMMAND_PASSWORD}
spring.datasource.command.driverClassName=org.postgresql.Driver
spring.datasource.command.hikari.minimum-idle=2
spring.datasource.query.url=${SPRING_DATASOURCE_QUERY_URL}
spring.datasource.query.username=${SPRING_DATASOURCE_QUERY_USERNAME}
spring.datasource.query.password=${SPRING_DATASOURCE_QUERY_PASSWORD}
spring.datasource.query.driverClassName=org.postgresql.Driver
spring.datasource.query.hikari.minimum-idle=5
# ===============================================================
# LOGGING DEVELOPMENT
# ===============================================================
logging.level.root=INFO
logging.level.co.com=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
# ===============================================================
# KAFKA & CORS DEVELOPMENT
# ===============================================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:}
cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
management.endpoints.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# ===============================================================
# HIKARI TUNING (Ambiente Dev)
# ===============================================================
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=6
spring.datasource.command.hikari.maximum-pool-size=5
spring.datasource.query.hikari.maximum-pool-size=10
# ===============================================================
# MICROSERVICIOS & GRPC (URLs de DEV)
# ===============================================================
microservice.audit=${MICROSERVICE_AUDIT_URL:}
microservice.authentication=${MICROSERVICE_AUTH_URL:}
microservice.utility_services=${MICROSERVICE_UTILITY_URL:}

grpcservice.audit=${GRPCSERVICE_AUDIT_URL:}
grpcservice.authentication=${GRPCSERVICE_AUTH_URL:}
grpcservice.utility_services=${GRPCSERVICE_UTILITY_URL:}
# ===============================================================
# SERVICIO DE EMAIL & OCI (Compartido por Perfil)
# ===============================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

spring.cloud.oci.config.profile=${OCI_CONFIG_PROFILE:default}
spring.cloud.oci.objectstorage.bucketName=${OCI_OBJECTSTORAGE_BUCKET:}
spring.cloud.oci.objectstorage.namespace=${OCI_OBJECTSTORAGE_NAMESPACE:}
oci.tenancy=${OCI_TENANCY:}
oci.user=${OCI_USER:}
oci.fingerprint=${OCI_FINGERPRINT:}
oci.region=${OCI_REGION:}
oci.pem=${OCI_PEM:}
