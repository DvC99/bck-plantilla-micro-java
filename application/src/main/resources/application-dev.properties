# ===============================================================
# JPA DEVELOPMENT (Sobrescritura)
# ===============================================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.format_sql=true
# Desactiva el uso de Spring Cloud Config en desarrollo local
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
# Usa H2 en memoria y dialecto H2 para desarrollo
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
app.messaging.kafka.enabled=false
# ===============================================================
# BASE DE DATOS COMPARTIDA (Servidor y Credenciales de DEV)
# ===============================================================
spring.datasource.command.url=jdbc:h2:mem:commanddb;DB_CLOSE_DELAY=-1
spring.datasource.command.username=sa
spring.datasource.command.password=
spring.datasource.command.driverClassName=org.h2.Driver
spring.datasource.query.url=jdbc:h2:mem:querydb;DB_CLOSE_DELAY=-1
spring.datasource.query.username=sa
spring.datasource.query.password=
spring.datasource.query.driverClassName=org.h2.Driver
# ===============================================================
# LOGGING DEVELOPMENT
# ===============================================================
logging.level.root=INFO
logging.level.co.com=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoAction=DEBUG
# ===============================================================
# KAFKA & CORS DEVELOPMENT
# ===============================================================
spring.kafka.bootstrap-servers=
cors.allowedOrigins=http://localhost:4200
management.endpoints.web.cors.allowed-origins=http://localhost:4200
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# ===============================================================
# HIKARI TUNING (Ambiente Dev)
# ===============================================================
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=6
spring.datasource.command.hikari.maximum-pool-size=5
spring.datasource.query.hikari.maximum-pool-size=10
# ===============================================================
# MICROSERVICIOS & GRPC (URLs de DEV)
# ===============================================================
microservice.audit=
microservice.authentication=
microservice.utility_services=

grpcservice.audit=
grpcservice.authentication=
grpcservice.utility_services=
# ===============================================================
# SERVICIO DE EMAIL & OCI (Compartido por Perfil)
# ===============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.cloud.oci.config.profile=default
spring.cloud.oci.objectstorage.bucketName=
spring.cloud.oci.objectstorage.namespace=
oci.tenancy=
oci.user=
oci.fingerprint=
oci.region=
oci.pem=
